# The one pytest config for the Python that ships inside plugin and adapter packages. No testpaths:
# each repo's gate names the tests it owns.
[pytest]
asyncio_mode = auto
# A single hung test must fail fast with a stack dump, never stall the gate. The thread method works
# off the main thread and dumps every frame at the deadlock. Raise it per test with
# @pytest.mark.timeout(N) for a genuinely slow case.
timeout = 60
timeout_method = thread
