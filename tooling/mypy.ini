# The one mypy config for the Python that ships inside plugin and adapter packages. Kept in step with
# the [tool.mypy] block in daemon/pyproject.toml by hand, for the same reason as ruff.toml.
[mypy]
python_version = 3.11
disallow_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
# Reachability guard: flags code a human can never reach, a branch killed by type narrowing, a
# statement after an unconditional return or raise, a handler that can never fire. Surfaces an
# orphaned code path early instead of in production.
warn_unreachable = True
exclude = ^dist/
