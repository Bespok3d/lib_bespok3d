name: pr-gate

# Every pull request and every push to dev or main runs this repo's own gate, so nothing reaches a
# release branch without the check the maintainer runs locally. lib_bespok3d is self-contained: it
# carries its own detectors under tooling/, so no sibling checkout is needed here.
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the Python linter the gate runs
        run: pip install ruff

      # check.sh runs the per-file licence check through `reuse`, which is not on the runner image.
      # Without it the check reports itself as skipped, so a file naming a licence whose text is
      # missing from LICENSES/ would reach main unnoticed. Installed with pip rather than through a
      # marketplace action, so the workflow-pinning guard has nothing new to pin. The
      # charset-normalizer extra is not optional: reuse aborts on start without an encoding backend.
      - name: Install the REUSE licence linter
        run: pip install 'reuse[charset-normalizer]'
      - name: Install the TypeScript contract's dependencies
        working-directory: ts
        run: npm ci
      - name: Run the gate
        run: bash scripts/check.sh
